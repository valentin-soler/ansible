---
- name: Job 3 - Durcissement noyau et politiques de mot de passe
  hosts: all_servers
  become: true
  vars:
    sysctl_settings:
      - { key: "net.ipv4.tcp_syncookies", value: "1" }
      - { key: "net.ipv4.ip_forward", value: "0" }
      - { key: "net.ipv4.conf.all.accept_redirects", value: "0" }
      - { key: "net.ipv4.conf.all.send_redirects", value: "0" }
      - { key: "net.ipv4.conf.all.accept_source_route", value: "0" }
      - { key: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
      - { key: "kernel.randomize_va_space", value: "2" }

  tasks:
    ### 1. DURCISSEMENT NOYAU VIA SYSCTL ###
    - name: Appliquer les paramètres de durcissement du noyau
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-hardening.conf
        state: present
        reload: true
      loop: "{{ sysctl_settings }}"

    ### 2. POLITIQUE DE MOT DE PASSE - LONGUEUR MINIMALE ET HISTORIQUE (login.defs) ###
    - name: Forcer une longueur minimale de mot de passe (login.defs)
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^#?PASS_MIN_LEN'
        line: 'PASS_MIN_LEN   12'
        backup: true

    - name: Forcer l'expiration maximale du mot de passe (login.defs)
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^#?PASS_MAX_DAYS'
        line: 'PASS_MAX_DAYS   90'
        backup: true

    - name: Forcer le délai minimal entre changements (login.defs)
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^#?PASS_MIN_DAYS'
        line: 'PASS_MIN_DAYS   1'
        backup: true

    ### 3. POLITIQUE DE COMPLEXITÉ ET HISTORIQUE - DEBIAN (pam_pwquality + pam_unix) ###
    - name: Installer libpam-pwquality (Debian)
      ansible.builtin.apt:
        name: libpam-pwquality
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Configurer la complexité des mots de passe (Debian - pwquality)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password\s+requisite\s+pam_pwquality\.so'
        line: 'password        requisite                       pam_pwquality.so retry=3 minlen=12 dcredit=-1 ucredit=-1 lcredit=-1 ocredit=-1'
        insertbefore: '^password\s+\[success=1'
        backup: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Configurer l'historique des mots de passe (Debian - pam_unix)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password\s+\[success=1'
        line: 'password        [success=1 default=ignore]      pam_unix.so obscure use_authtok try_first_pass sha512 remember=5'
        backup: true
      when: ansible_facts['os_family'] == "Debian"

    ### 4. POLITIQUE DE COMPLEXITÉ ET HISTORIQUE - ROCKY (pam_pwquality + pam_unix via system-auth) ###
    - name: Installer pam_pwquality (Rocky)
      ansible.builtin.yum:
        name: pam
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Configurer la complexité des mots de passe (Rocky - pwquality.conf)
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: "^{{ item.key }}"
        line: "{{ item.key }} = {{ item.value }}"
        backup: true
      loop:
        - { key: "minlen", value: "12" }
        - { key: "dcredit", value: "-1" }
        - { key: "ucredit", value: "-1" }
        - { key: "lcredit", value: "-1" }
        - { key: "ocredit", value: "-1" }
        - { key: "retry", value: "3" }
      when: ansible_facts['os_family'] == "RedHat"

    - name: Configurer l'historique des mots de passe (Rocky - system-auth)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/system-auth
        regexp: '^password\s+sufficient\s+pam_unix\.so'
        line: 'password    sufficient    pam_unix.so sha512 shadow use_authtok remember=5'
        backup: true
      when: ansible_facts['os_family'] == "RedHat"

    - name: Vérifier l'application des paramètres sysctl
      ansible.builtin.command: sysctl net.ipv4.tcp_syncookies net.ipv4.ip_forward
      register: sysctl_verify
      changed_when: false

    - name: Afficher le résultat de la vérification sysctl
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} : {{ sysctl_verify.stdout_lines }}"